name: daily-telegram-news

on:
  schedule:
    - cron: "30 7 * * *"   # 07:30 UTC 每天运行
  workflow_dispatch:        # 支持手动触发

# 需要写权限才能 commit 回 docs/ 和 .last_sent.json
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci || npm i

      - name: Run bot
        run: node scripts/run.mjs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 网站 URL（填写后 Telegram 消息末尾会附上链接）
          # SITE_URL: https://你的用户名.github.io/DailyNewTelegram/
          # LLM 点评（本地运行时可开启）
          # USE_LLM: "false"
          # OLLAMA_URL: "http://localhost:11434"
          # LLM_MODEL: "qwen2.5"
