name: daily-telegram-news

concurrency:
  group: daily-telegram-news
  cancel-in-progress: false

on:
  schedule:
    - cron: "30 7 * * *"   # 07:30 UTC 每天运行
  workflow_dispatch:        # 支持手动触发
    inputs:
      force:
        description: "强制重新运行（跳过今日重复检查）"
        type: boolean
        default: false

# 需要写权限才能 commit 回 docs/ 和 .last_sent.json
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      # ── Step 1: 新闻抓取 + 生成 SPA（只 commit，不 push）─────────────────────
      - name: Run news bot
        run: node scripts/run.mjs ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        env:
          BOT_TOKEN:      ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID:     ${{ secrets.TG_CHAT_ID }}
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          USE_LLM:        "true"
          SITE_URL:       "https://midnitecome.github.io/DailyNewTelegram/"
          SKIP_GIT_PUSH:  "true"
          # Newsletter (IMAP)
          ENABLE_EMAIL:   "true"
          IMAP_HOST:      "imap.gmail.com"
          IMAP_USER:      ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD:  ${{ secrets.IMAP_PASSWORD }}

      # ── Step 2: Podcast 抓取（只 commit，不 push）────────────────────────────
      - name: Update podcasts
        run: node scripts/podcast.mjs
        env:
          SKIP_GIT_PUSH: "true"   # 同上

      # ── Step 3: 统一 push → 触发唯一一次 pages-build-deployment ────────────
      - name: Push all changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 若两个脚本都无变更（均跳过 commit），此处 push 也是 no-op
          git push || echo "nothing to push"
