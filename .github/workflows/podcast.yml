name: podcast-update

on:
  schedule:
    - cron: "0 8  * * *"   # 08:00 UTC
    - cron: "0 14 * * *"   # 14:00 UTC
    - cron: "0 20 * * *"   # 20:00 UTC
  workflow_dispatch:        # 支持手动触发

# 需要写权限才能 commit 回 docs/data/podcasts.json
permissions:
  contents: write

jobs:
  podcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci || npm i

      - name: Fetch & generate podcasts
        run: node scripts/podcast.mjs
